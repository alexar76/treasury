[project]
# aimarket-treasury — the payer. A SEPARATE distribution and a SEPARATE container from MOMUS on
# purpose: it holds the one key that can release a bounty, and MOMUS never sees it. The aimarket-*
# name follows the same PyPI-collision rule as the rest of the ecosystem.
name = "aimarket-treasury"
version = "0.1.0"
description = "MOMUS Treasury — the separate payer role that releases red-team bounties only on independent verification; MOMUS finds and signs, the Treasury (its own key) pays"
readme = "README.md"
requires-python = ">=3.11"
# Depends on aimarket-momus for the finding/verdict document types and the PayoutGate decision
# logic. The dependency is one-way: MOMUS never imports treasury.
dependencies = ["aimarket-momus>=0.1", "aimarket-oracle-core>=0.2", "fastapi>=0.115", "httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0", "pytest-cov>=5.0.0", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["treasury"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

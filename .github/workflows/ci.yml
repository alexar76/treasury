# Treasury CI — unit suite. On the GitHub mirror, oracle-core + momus are vendored.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [[ -d vendor/oracle-core && -d vendor/momus ]]; then
            pip install -e vendor/oracle-core -e vendor/momus -e ".[dev]"
          elif [[ -d vendor/oracle-core ]]; then
            pip install -e vendor/oracle-core -e ".[dev]"
          else
            pip install -e ".[dev]"
          fi
      - name: Pytest
        run: pytest -q --tb=short
